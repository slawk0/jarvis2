# docker compose -f dev/test-server/docker-compose.yml up -d --build
services:
  server:
    build: .
    container_name: jarvis-test-server
    hostname: jarvis-test
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # The host Docker daemon, so the Docker tab has something to manage.
      - /var/run/docker.sock:/var/run/docker.sock
      # Public keys allowed to log in as keyuser; installed by the entrypoint unit below.
      - ./authorized_keys:/etc/jarvis-test/authorized_keys:ro
    ports:
      - '127.0.0.1:2222:22'
  mysql:
    image: mariadb:11
    container_name: jarvis-test-mysql
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: shop
      MARIADB_USER: shop
      MARIADB_PASSWORD: shoppw
  postgres:
    image: postgres:17-alpine
    container_name: jarvis-test-postgres
    environment:
      POSTGRES_PASSWORD: pgpw
      POSTGRES_DB: appdb
      POSTGRES_USER: app
